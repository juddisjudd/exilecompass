[workspace]
members = [".", "overlay-core"]
resolver = "2"

[package]
name = "exilecompass"
version = "1.3.0"
description = "ExileCompass - Path of Exile 2 overlay"
authors = ["juddisjudd"]
edition = "2021"

# The `_lib` suffix avoids a name collision between the lib and bin on Windows.
# See: https://github.com/rust-lang/cargo/issues/8519
[lib]
name = "exilecompass_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
overlay-core = { path = "overlay-core" }
raw-window-handle = "0.6"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
rustpotter = "3"
cpal = "0.15"
hound = "3"
# Pins `half` (a transitive dep via candle-core, which rustpotter's NN-model
# support pulls in even though we only use its sample-based WakewordRef path)
# below the version where it moved to rand 0.9 — candle-core 0.2.2 is written
# against rand_distr 0.4.3 (rand 0.8) and fails to compile against half's
# newer rand-0.9-based Distribution impls otherwise.
half = "=2.4.1"
# Windows Credential Manager / Linux Secret Service (default features cover
# both — Linux backend is a pure-Rust D-Bus client, no libsecret dev headers
# needed at build time). Used only for the optional ElevenLabs API key; falls
# back to plain settings.json (frontend-side) if no OS keychain is reachable,
# e.g. Linux with no keyring daemon running.
keyring = "4"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-dialog = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-single-instance = "2"

