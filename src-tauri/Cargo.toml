[workspace]
members = [".", "overlay-core"]
resolver = "2"

[package]
name = "exilecompass"
version = "1.5.4"
description = "ExileCompass - Path of Exile 2 overlay"
authors = ["juddisjudd"]
edition = "2021"

# The `_lib` suffix avoids a name collision between the lib and bin on Windows.
# See: https://github.com/rust-lang/cargo/issues/8519
[lib]
name = "exilecompass_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
overlay-core = { path = "overlay-core" }
raw-window-handle = "0.6"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
# Offline TTS voice downloads (sherpa-onnx tts-models release archives).
futures-util = "0.3"
tar = "0.4"
bzip2 = "0.4"
zip = { version = "2", default-features = false, features = ["deflate"] }
cpal = "0.15"
# TTS playback on a user-chosen output device (ElevenLabs MP3 + SAPI WAV).
# 0.20 shares cpal 0.15 with the voice-command capture above.
rodio = "0.20"
# Windows Credential Manager / Linux Secret Service (default features cover
# both — Linux backend is a pure-Rust D-Bus client, no libsecret dev headers
# needed at build time). Used only for the optional ElevenLabs API key; falls
# back to plain settings.json (frontend-side) if no OS keychain is reachable,
# e.g. Linux with no keyring daemon running.
keyring = "4"
sherpa-onnx = { version = "1.13.5", default-features = false, features = ["static"] }
sysinfo = "0.39.6"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-dialog = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-single-instance = "2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.52", features = ["Win32_Foundation", "Win32_System_Registry"] }

